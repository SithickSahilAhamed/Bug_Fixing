<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to Secure Notes Manager.">
  <title>Sign In – Secure Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">

      <div class="auth-icon">🔑</div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to access your secure vault</p>

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input id="username" type="text" placeholder="Your username" autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button onclick="login()" id="btn-login">🔓 Sign In</button>

      <div class="auth-footer">
        New here? <a href="register.html">Create a free account</a>
      </div>

    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
