<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your secure notes dashboard.">
  <title>Dashboard – Secure Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard-wrapper">

    <!-- ── Header ── -->
    <header class="dashboard-header">
      <div class="header-brand">
        <div class="header-logo">🗒️</div>
        <span class="header-title">Secure Notes</span>
      </div>
      <div class="header-actions">
        <button class="btn-logout" onclick="logout()" id="btn-logout">← Sign Out</button>
      </div>
    </header>

    <!-- ── Main ── -->
    <main class="dashboard-main">

      <!-- Create Note Card -->
      <div class="create-note-card">
        <div class="section-title">New Note</div>

        <div class="form-group">
          <label class="form-label" for="title">Title</label>
          <input id="title" type="text" placeholder="Give your note a title…">
        </div>

        <div class="form-group">
          <label class="form-label" for="content">Content</label>
          <textarea id="content" placeholder="Write your note here…"></textarea>
        </div>

        <button onclick="createNote()" id="btn-add-note">＋ Add Note</button>
      </div>

      <!-- Notes Grid -->
      <div class="notes-section-header">
        <div class="section-title">Your Notes</div>
        <span class="notes-count" id="notes-count">0 notes</span>
      </div>

      <div id="notes">
        <div class="empty-state">
          <span class="empty-state-icon">📭</span>
          <p class="empty-state-text">No notes yet — add your first one above!</p>
        </div>
      </div>

    </main>
  </div>

  <script src="app.js"></script>
  <script>
    // Live notes counter via MutationObserver (no logic change in app.js)
    const notesEl = document.getElementById('notes');
    const countEl = document.getElementById('notes-count');
    const updateCount = () => {
      const n = notesEl.querySelectorAll(':scope > div:not(.empty-state)').length;
      if (countEl) countEl.textContent = n + (n === 1 ? ' note' : ' notes');
    };
    new MutationObserver(updateCount).observe(notesEl, { childList: true });
  </script>
</body>
</html>
